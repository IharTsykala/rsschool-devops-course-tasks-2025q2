apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-policies
  namespace: monitoring
data:
  notification-policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: TestEmail
        group_by: [ '...' ]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
